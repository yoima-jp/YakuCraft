name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check:version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    # GitHub の Windows runner では、アプリ単体は起動できるのに WebDriver のセッション作成だけが
    # 失敗する（DevToolsActivePort が作られない）。原因が分かるまで手動実行だけにして、
    # push のたびに main が赤くならないようにする。手元の Windows では npm run test:e2e が通る。
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run test:e2e

      # E2E は WebDriver のセッション作成で失敗すると原因がログに残らない。
      # アプリ単体が起動できるか、WebView2 と driver の版が合っているかを切り分ける。
      - name: Diagnose E2E failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Directory | Select-Object Name
          Get-ChildItem e2e\.cache\msedgedriver -ErrorAction SilentlyContinue | Select-Object Name
          $env:YAKUCRAFT_DATA_DIR = Join-Path $env:RUNNER_TEMP "yakucraft-diagnose"
          $app = Start-Process target\debug\yakucraft.exe -PassThru -RedirectStandardError stderr.txt -RedirectStandardOutput stdout.txt
          Start-Sleep -Seconds 20
          $app.Refresh()
          "alive=$(-not $app.HasExited) exit=$($app.ExitCode) title='$($app.MainWindowTitle)'"
          Get-Content stderr.txt, stdout.txt
          Get-ChildItem $env:YAKUCRAFT_DATA_DIR -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-30) } -MaxEvents 10 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message
