# cargo audit の除外設定。除外は理由があるものだけに限り、解消できたら必ず消す。
[advisories]
# zip 4.6.1 は tauri-plugin-updater 2.x（Windows 向け）経由でだけ入る。2026-10 時点で zip 9 対応の
# updater 2.x は crates.io に出ておらず、未リリースの git コミットに固定するのは自動更新の安定性を損なう。
# これらは ZIP 展開時の Unix 権限・シンボリックリンクの扱いの問題で、YakuCraft の更新成果物は
# createUpdaterArtifacts: true による .exe 直配布（zip 展開を通らない）かつ署名検証後にしか扱われないため、
# 実害はないと判断した。updater が zip 9 以上に上がったらこの除外を削除する。
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]
